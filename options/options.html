<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>TranslatorForBrowser 设置</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <h1>TranslatorForBrowser 设置</h1>
    <p class="sub">YouTube 日语直播 / 视频字幕实时翻译</p>

    <section>
      <h2>翻译引擎</h2>
      <label class="radio"><input type="radio" name="engine" value="google"> 免费 Google 翻译(默认,零配置)</label>
      <label class="radio"><input type="radio" name="engine" value="custom"> 自定义 OpenAI 兼容 API</label>
      <div id="customFields" class="fields" hidden>
        <label>API Base URL
          <input type="text" id="customBaseUrl" placeholder="https://api.deepseek.com 或 https://ark.cn-beijing.volces.com/api/v3">
        </label>
        <label>API Key
          <input type="password" id="customApiKey" placeholder="sk-...">
        </label>
        <label>模型名
          <input type="text" id="customModel" placeholder="deepseek-chat / doubao-1-5-pro-32k(或你的接入点 ID)">
        </label>
        <p class="hint">Key 只保存在本机(chrome.storage.local),不会同步到云端。</p>
      </div>
    </section>

    <section>
      <h2>字幕显示</h2>
      <label>目标语言(译文输出语言)
        <input type="text" id="targetLang" placeholder="zh-CN(简体中文)、zh-TW、en、ko 等语言代码">
      </label>
      <label class="check"><input type="checkbox" id="showOriginal"> 同时显示日语原文(双语)</label>
      <label class="range">字号 <input type="range" id="fontSize" min="12" max="32" step="1"> <span id="fontSizeVal"></span></label>
      <label class="check"><input type="checkbox" id="enabled"> 新标签页默认开启字幕翻译</label>
      <label class="check"><input type="checkbox" id="translateChat"> 翻译直播聊天(评论区评论)</label>
    </section>

    <section>
      <h2>语音识别(无字幕时兜底)</h2>
      <p class="hint">YouTube 没有字幕时,用火山引擎把声音实时转成文字(约 7 秒延迟)。
        需在<a href="https://console.volcengine.com/speech/app" target="_blank">豆包语音控制台</a>
        开通「流式语音识别-大模型」并签发 API Key(<b>火山方舟的 Key 不通用</b>)。按转写时长计费。</p>
      <label>API Key
        <input type="password" id="asrApiKey" placeholder="豆包语音控制台签发的 Key">
      </label>
      <label>识别语言
        <input type="text" id="asrLanguage" placeholder="ja-JP(留空 = 自动检测)">
      </label>
      <button id="asrTestBtn">测试识别 Key</button>
      <p id="asrTestResult" class="hint"></p>
    </section>

    <section>
      <h2>测试</h2>
      <button id="testBtn">测试翻译「こんにちは、世界」</button>
      <p id="testResult" class="hint"></p>
    </section>

    <footer>
      <button id="saveBtn" class="primary">保存</button>
      <span id="saveStatus" class="hint"></span>
    </footer>
  </main>
  <script src="options.js"></script>
</body>
</html>
